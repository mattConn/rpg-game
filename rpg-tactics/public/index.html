<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wolf Dungeon</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /*
       * Two stacked canvases, WebGL underneath and the 2D UI on top. Unlike the
       * real-time 3D client these are *not* pinned to 4:3 — the room is a fixed
       * 900 units tall and as many wide as the window allows, so the canvas
       * fills the browser's width. The flex centring above is what letterboxes
       * the leftover height on a window narrower than 4:3.
       */
      #stage {
        position: relative;
        line-height: 0;
      }

      #stage canvas {
        display: block;
      }

      #scene {
        image-rendering: pixelated;
        background: #000;
      }

      /* Transparent: an opaque backing here would hide the whole board. */
      #ui {
        position: absolute;
        top: 0;
        left: 0;
        background: transparent;
        cursor: default;
      }
      #graphics-settings {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border: 1px solid #716249;
        border-radius: 6px;
        background: #171510ed;
        color: #e9dfca;
        font: 13px system-ui, sans-serif;
      }
      #graphics-quality {
        padding: 5px 8px;
        border: 1px solid #716249;
        border-radius: 4px;
        background: #28241c;
        color: #fff1d4;
        font: inherit;
        cursor: pointer;
      }
      #graphics-quality:focus-visible { outline: 2px solid #e6bf72; outline-offset: 3px; }
      #play-help { position: fixed; left: 16px; bottom: 14px; color: #ddd2bb; font: 12px monospace; text-shadow: 1px 2px 2px #000; pointer-events: none; }
      #connection-status { position: fixed; top: 54px; left: 16px; color: #eccd87; font: 13px monospace; pointer-events: none; }
      #performance { color: #aaa28f; font: 11px monospace; min-width: 40px; }
      @media (max-width: 700px) { #play-help { bottom: 8px; font-size: 10px; } #connection-status { top: 90px; } }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="scene"></canvas>
      <canvas id="ui"></canvas>
    </div>
    <div id="play-help">WASD move · drag to look · click attack · E eat · Shift run</div>
    <div id="connection-status">Loading dungeon…</div>
    <div id="graphics-settings">
      <span id="performance"></span>
      <label for="graphics-quality">Graphics</label>
      <select id="graphics-quality" aria-label="Graphics quality" title="Changing graphics reloads the game to apply rendering detail">
        <option value="low">Low</option>
        <option value="med">Med</option>
        <option value="high" selected>High</option>
        <option value="max">Max</option>
      </select>
    </div>
    <script src="/tactics.js"></script>
  </body>
</html>
