<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dungeon Level Editor</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: #e8e9ed; }
      body { display: grid; grid-template-columns: 248px minmax(0, 1fr); }
      aside { overflow-y: auto; padding: 14px; border-right: 1px solid #303541; background: #12151c; }
      h1 { margin: 0 0 4px; font: 700 20px Georgia, serif; color: #d5b76d; }
      .sub { margin: 0 0 16px; color: #9299a8; font-size: 12px; line-height: 1.4; }
      h2 { margin: 16px 0 8px; color: #b5bac6; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
      .tool { min-height: 58px; padding: 7px 5px; border: 1px solid #363c49; border-radius: 5px; background: #1a1e27; color: #d8dbe2; cursor: grab; text-align: center; }
      .tool:hover { background: #222834; border-color: #697287; }
      .tool.selected { border-color: #d5b76d; box-shadow: inset 0 0 0 1px #d5b76d; background: #292619; }
      .tool .icon { display: block; height: 25px; font-size: 20px; line-height: 25px; }
      .tool .label { display: block; margin-top: 3px; font-size: 11px; }
      main { min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
      header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #303541; background: #11141a; }
      button, input { height: 32px; border: 1px solid #3b4250; border-radius: 4px; background: #1c212b; color: #e4e6eb; }
      button { padding: 0 12px; cursor: pointer; }
      button:hover { background: #29303d; border-color: #6c768b; }
      button.danger { color: #efaaa5; }
      input[type="text"] { width: 150px; padding: 0 9px; }
      input[type="number"] { width: 62px; padding: 0 7px; }
      label { display: inline-flex; align-items: center; gap: 5px; color: #aeb4c0; font-size: 12px; }
      .spacer { flex: 1; }
      #viewport { overflow: auto; position: relative; background-color: #080a0e; background-image: radial-gradient(#1e232d 1px, transparent 1px); background-size: 18px 18px; }
      #canvas-wrap { min-width: 100%; min-height: 100%; display: grid; place-items: center; padding: 64px; }
      canvas { display: block; box-shadow: 0 0 0 1px #454b58, 0 12px 50px #000; background: #050609; cursor: crosshair; image-rendering: pixelated; }
      footer { min-height: 31px; display: flex; align-items: center; gap: 18px; padding: 0 12px; border-top: 1px solid #303541; background: #11141a; color: #969dac; font: 12px ui-monospace, SFMono-Regular, monospace; }
      #status { color: #d5b76d; }
      .hint { margin-left: auto; }
      #import-file { display: none; }
    </style>
  </head>
  <body>
    <aside>
      <h1>Dungeon Editor</h1>
      <p class="sub">Drag tools onto the map, click to paint, or drag existing units to reposition them.</p>
      <h2>Tiles</h2>
      <div class="palette" id="tile-palette"></div>
      <h2>Spawns & enemies</h2>
      <div class="palette" id="entity-palette"></div>
      <h2>Objects</h2>
      <div class="palette" id="object-palette"></div>
    </aside>
    <main>
      <header>
        <input id="level-name" type="text" value="Untitled Dungeon" aria-label="Level name" />
        <label>W <input id="grid-width" type="number" min="8" max="100" value="40" /></label>
        <label>H <input id="grid-height" type="number" min="8" max="100" value="28" /></label>
        <button id="resize-grid">Resize</button>
        <span class="spacer"></span>
        <button id="undo">Undo</button><button id="redo">Redo</button>
        <button id="save">Save</button><button id="load">Load</button>
        <button id="play">▶ Play</button>
        <button id="export">Export JSON</button><button id="import">Import JSON</button>
        <button id="clear" class="danger">Clear</button>
        <label>Zoom <input id="zoom" type="range" min="16" max="44" value="28" /></label>
        <input id="import-file" type="file" accept="application/json,.json" />
      </header>
      <div id="viewport"><div id="canvas-wrap"><canvas id="editor"></canvas></div></div>
      <footer><span id="status">Ready</span><span id="coords">—</span><span id="counts">—</span><span class="hint">Right-click erases · Ctrl/Cmd+Z undoes</span></footer>
    </main>
    <script src="/editor.js"></script>
  </body>
</html>
