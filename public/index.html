<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Single-Player RPG</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Sized by the game to the largest 4:3 rectangle the window allows. */
      canvas {
        display: block;
        background: #000;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1200" height="900"></canvas>
    <script src="/game.js"></script>
  </body>
</html>
